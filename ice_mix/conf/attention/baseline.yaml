# Attention Mechanism Configuration (Baseline)
model_name: "IceMix"

# Transformer Architecture
hidden_dim: 384
seq_length: 128
depth: 12
head_size: 32
n_rel: 4
scaled_emb: true
include_dynedge: false
n_features: 6  # Will be dynamically set in code usually, but good to have default
maha_encoder: false

# Dropout
dropout: 0.1
attn_drop: 0.05
proj_drop: 0.1
drop_path_rate: 0.2
token_drop: 0.0

# Mathematical Settings
pos_time_multiplier: 4096.0
charge_rde_multiplier: 1024.0
spacetime_distance_scale: 18.0
spacetime_distance_clip_min: -4.0
spacetime_distance_clip_max: 4.0
spacetime_distance_multiplier: 1024.0
mlp_ratio: 4.0
init_values: 1.0
n_freq: 10000.0
