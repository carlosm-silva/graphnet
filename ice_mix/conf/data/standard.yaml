# Data Configuration

# Paths — $DATA_ROOT must be set in the environment before running.
path:
  - "${oc.env:DATA_ROOT}/my_numu_database_part_1 (1).db"
  - "${oc.env:DATA_ROOT}/my_nue_database_part_1 (1).db"
  - "${oc.env:DATA_ROOT}/my_nutau_database_part_1 (1).db"

pulsemap: "SRTInIcePulses"
target: "direction"
truth_table: "truth"

# DataLoader
batch_size: 256
pin_memory: true
persistent_workers: true
prefetch_factor: 4
max_pulses: 256

augment_rotation: false
# Persist the augmentation seed in the resolved Hydra config. Override with
# ``null`` only when deliberately requesting non-reproducible entropy.
rotation_seed: ${seed}
