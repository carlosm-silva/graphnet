defaults:
  - _self_
  - attention: baseline
  - data: standard
  - data/split: random

# Global Experiment Settings
project_name: "IceMix"
run_name: "${project_name}_${now:%Y-%m-%d}_${now:%H-%M-%S}_job-${oc.env:SLURM_JOB_ID,local}"
seed: 42
debug: false
precision: "16-mixed"  # Mixed precision

# Hardware
# Device count comes from CUDA_VISIBLE_DEVICES at runtime; do not add `gpus:` here.
num_workers: 3

# Training
max_epochs: 100
early_stopping_patience: 12
accumulate_grad_batches: 1
limit_train_batches: null
limit_val_batches: null
wandb: true
wandb_project: null
wandb_group: null
fail_on_non_finite: false

# Optimization
# lr: 0.0000625  # 1e-3 / 16
lr: 6.25e-5
alpha: 0.026  # JointLoss alpha
optimizer:
  name: adamw
  adamw:
    eps: 1.0e-5
    weight_decay: 0.01
  lbfgs:
    lr: 1.0
    max_iter: 20
    history_size: 20
    line_search_fn: "strong_wolfe"
    tolerance_grad: 0.0
    tolerance_change: 0.0
    reset_history_each_step: true
use_scheduler: true
scheduler:
  name: plateau
  patience: 6
  factor: 0.5
  # Used by the cosine scheduler; eta_min = lr * eta_min_factor.
  eta_min_factor: 0.1
ema:
  enabled: false
  decay: 0.999

# Training Mode
multistage: false
num_stages: 5
stage_epochs: null

# Paths
output_dir: "${hydra:runtime.cwd}/ice_mix/outputs/${run_name}"
scratch_dir: "${hydra:runtime.cwd}/ice_mix/checkpoints/${run_name}"
checkpoint_dir: "${output_dir}/checkpoints"
logs_dir: "${output_dir}/logs"
ckpt_path: null
fine_tune_from_ckpt: null
fine_tune:
  # null keeps every parameter trainable; fine-tune launchers override this.
  train_last_n_blocks: null
